name: sync-data

# Weekly refresh of the vendored dataset snapshot from agentic-attack-index.
#
# Mirrors the upstream repo's patterns:
#  - "single issue": a validation failure (schema drift) opens ONE tracked issue
#    and appends to it on later runs instead of opening duplicates;
#  - "dist drift": a changed snapshot never lands on main directly; it goes
#    through a PR on a fixed branch (chore/sync-data) that is updated in place,
#    so CI validates it and a human merges it.
#
# This is the only workflow that touches the network for data.
#
# Token: the PR is opened with the SYNC_PR_TOKEN secret when it exists (a
# fine-grained PAT scoped to this repository with Contents: write and Pull
# requests: write), else with the built-in token. The PAT is preferred for two
# reasons: the MLSecOpsHub organisation does not allow GitHub Actions to create
# pull requests with GITHUB_TOKEN ("GitHub Actions is not permitted to create
# or approve pull requests"), and a branch pushed with GITHUB_TOKEN never
# triggers the CI workflow on the resulting PR, so the sync PR would arrive
# with no checks. When PR creation fails anyway, the snapshot stays on the
# branch and ONE tracked issue (updated in place) says so, with the compare
# link, so the data is never silently stranded.
on:
  schedule:
    - cron: '23 5 * * *' # daily 05:23 UTC; a changed upstream snapshot is a PR the same day
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to sync from ('latest' = newest tagged release; or a tag like v0.6.0; or main)
        required: false
        default: latest

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-data
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/sync-data

jobs:
  sync:
    name: fetch upstream snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Persisted for the push below: a PAT push triggers CI on the PR, a GITHUB_TOKEN push does not.
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Record the current snapshot
        id: before
        run: |
          echo "version=$(node -p "require('./data/snapshot/SNAPSHOT.json').dataset_version")" >> "$GITHUB_OUTPUT"
          echo "total=$(node -p "require('./data/snapshot/SNAPSHOT.json').total")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./data/snapshot/SNAPSHOT.json').source_commit || ''")" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream dist/ artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_REF: ${{ inputs.ref || 'latest' }}
        run: npm run sync:data

      - name: Detect snapshot change
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- data/snapshot)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot already matches upstream; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- data/snapshot
          fi

      - name: Validate the new snapshot (typecheck + lint + schema + tests)
        if: steps.diff.outputs.changed == 'true'
        id: validate
        run: |
          set +e
          npm test 2>&1 | tee validate.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the sync PR
        id: pr
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          USING_PAT: ${{ secrets.SYNC_PR_TOKEN != '' }}
          BEFORE_VERSION: ${{ steps.before.outputs.version }}
          BEFORE_TOTAL: ${{ steps.before.outputs.total }}
          BEFORE_COMMIT: ${{ steps.before.outputs.commit }}
        run: |
          set -euo pipefail
          echo "token: $([ "$USING_PAT" = "true" ] && echo SYNC_PR_TOKEN || echo GITHUB_TOKEN)"
          VERSION=$(node -p "require('./data/snapshot/SNAPSHOT.json').dataset_version")
          TOTAL=$(node -p "require('./data/snapshot/SNAPSHOT.json').total")
          COMMIT=$(node -p "require('./data/snapshot/SNAPSHOT.json').source_commit || 'unknown'")
          REF=$(node -p "require('./data/snapshot/SNAPSHOT.json').source_ref")
          FETCHED=$(node -p "require('./data/snapshot/SNAPSHOT.json').fetched_at")
          ADDED=$(node -e '
            const cur = new Set(require("./data/snapshot/summary.json").ids);
            const prev = new Set(JSON.parse(require("child_process").execSync("git show HEAD:data/snapshot/summary.json", {encoding: "utf8"})).ids);
            console.log([...cur].filter((x) => !prev.has(x)).map((x) => "- added `" + x + "`").join("\n"));
            console.log([...prev].filter((x) => !cur.has(x)).map((x) => "- removed `" + x + "` (ids are permanent upstream; investigate)").join("\n"));
          ')
          TITLE="chore(data): sync snapshot to agentic-attack-index v${VERSION} (${TOTAL} records)"
          BODY=$(cat <<MD
          <!-- sync-data-bot -->
          Automated weekly sync of \`data/snapshot/\` from [MLSecOpsHub/agentic-attack-index](https://github.com/MLSecOpsHub/agentic-attack-index) (\`${REF}\` @ \`${COMMIT}\`), fetched ${FETCHED}.

          | | before | after |
          |---|---|---|
          | dataset_version | ${BEFORE_VERSION} | ${VERSION} |
          | records | ${BEFORE_TOTAL} | ${TOTAL} |
          | upstream commit | \`${BEFORE_COMMIT:-unknown}\` | \`${COMMIT}\` |

          ${ADDED}

          The new snapshot passed \`npm test\` (schema validation included) in [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). This PR changes vendored data only; the dashboard never edits incident facts.
          MD
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add data/snapshot
          git commit -m "$TITLE" -m "Source: ${REF} @ ${COMMIT}. Fetched ${FETCHED}."
          git push --force origin "$SYNC_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<MD"
            echo "$TITLE"
            echo
            echo "| | before | after |"
            echo "|---|---|---|"
            echo "| dataset_version | ${BEFORE_VERSION} | ${VERSION} |"
            echo "| records | ${BEFORE_TOTAL} | ${TOTAL} |"
            echo "| upstream commit | \`${BEFORE_COMMIT:-unknown}\` | \`${COMMIT}\` |"
            echo
            echo "${ADDED}"
            echo "MD"
          } >> "$GITHUB_OUTPUT"
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            gh pr comment "$EXISTING" --body "Updated with a fresh snapshot: v${VERSION}, ${TOTAL} records, upstream \`${COMMIT}\`."
            echo "Updated PR #$EXISTING"
            echo "pr=$EXISTING" >> "$GITHUB_OUTPUT"
          elif gh pr create --base main --head "$SYNC_BRANCH" --title "$TITLE" --body "$BODY" --label data-sync 2> pr-error.log \
            || gh pr create --base main --head "$SYNC_BRANCH" --title "$TITLE" --body "$BODY" 2>> pr-error.log; then
            echo "pr=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
          else
            # The snapshot is pushed and validated; only the PR is missing. Hand it to the issue step below.
            echo "pr_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not open the sync PR: $(tr '\n' ' ' < pr-error.log)"
          fi

      - name: Open or update the "PR could not be created" issue
        if: steps.pr.outputs.pr_failed == 'true'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.pr.outputs.summary }}
          USING_PAT: ${{ secrets.SYNC_PR_TOKEN != '' }}
        with:
          script: |
            const fs = require('fs');
            const err = fs.existsSync('pr-error.log') ? fs.readFileSync('pr-error.log', 'utf8').trim() : '(no error output)';
            const marker = '<!-- sync-data-pr-bot -->';
            const label = 'data-sync';
            const branch = process.env.SYNC_BRANCH;
            const compare = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/compare/main...${branch}?expand=1`;
            const title = 'sync-data: a validated snapshot is waiting on chore/sync-data (PR could not be created)';
            const fix = process.env.USING_PAT === 'true'
              ? 'The SYNC_PR_TOKEN secret is set but PR creation still failed; check that the token has Contents: write and Pull requests: write on this repository and has not expired.'
              : 'Add a fine-grained PAT as the SYNC_PR_TOKEN repository secret (scoped to this repository, Contents: write, Pull requests: write), or allow GitHub Actions to create pull requests at the organisation and repository level (Settings → Actions → General → Workflow permissions).';
            const body = `${marker}\nThe sync fetched a changed snapshot, it passed \`npm test\`, and it is pushed to \`${branch}\`, but the PR could not be created:\n\n\`\`\`\n${err}\n\`\`\`\n\n**Open it by hand:** ${compare}\n\n**Fix for next time:** ${fix}\n\n${process.env.SUMMARY}\n\nRun: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (e) {
              if (e.status === 404) await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '0e8a16', description: 'Automated dataset snapshot sync' });
              else throw e;
            }
            const open = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 100 });
            const found = open.find((i) => !i.pull_request && i.body && i.body.includes(marker));
            if (found) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, title, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: [label], body });

      - name: Fail the job if the PR could not be created
        if: steps.pr.outputs.pr_failed == 'true'
        run: |
          echo "::error::The snapshot is validated and pushed to $SYNC_BRANCH, but the PR could not be created; see the data-sync issue for the compare link and the fix."
          exit 1

      - name: Open or update the schema-drift issue
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('validate.log', 'utf8').slice(-6000);
            const marker = '<!-- sync-data-drift-bot -->';
            const title = 'sync-data: upstream snapshot fails validation (schema drift?)';
            const label = 'data-sync';
            const body = `${marker}\nThe weekly sync fetched a changed snapshot from agentic-attack-index but it does not pass \`npm test\` ` +
              `(schema validation, typecheck, or unit tests). The snapshot was NOT committed; the site keeps rendering the last good one. ` +
              `Usually this means the upstream schema or taxonomy changed and \`src/data/types.ts\`, the adapter, or \`scripts/sync-data.mjs\` need updating.\n\n` +
              `Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              '```\n' + log + '\n```';

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: '0e8a16', description: 'Automated dataset snapshot sync' });
              } else {
                throw e;
              }
            }
            const open = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 100 });
            const found = open.find((i) => !i.pull_request && i.body && i.body.includes(marker));
            if (found) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: [label], body });
            }

      - name: Fail the job if the new snapshot did not validate
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.exit_code != '0'
        run: exit 1
