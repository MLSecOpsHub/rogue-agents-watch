name: CI

# Hermetic gate: typecheck + lint + snapshot schema validation + unit tests,
# then a build that must be reproducible and inside the bundle budget.
# No network is needed for any step after `npm ci`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build twice and require byte-identical output
        run: |
          npm run build
          (cd dist && find . -type f | sort | xargs sha256sum) > /tmp/build-1.sha256
          rm -rf dist
          npm run build
          (cd dist && find . -type f | sort | xargs sha256sum) > /tmp/build-2.sha256
          if ! diff /tmp/build-1.sha256 /tmp/build-2.sha256; then
            echo "::error::build is not deterministic; see the diff above"
            exit 1
          fi
          echo "build is reproducible ($(wc -l < /tmp/build-1.sha256) files)"

      - name: Bundle size budget (core < 500 KB gzipped, map geometry excluded)
        run: npm run size -- --max-gzip-kb 500

      - name: Snapshot must still match what sync-data would write
        # Guards against hand edits to data/snapshot/: re-serialising the vendored
        # files must be a no-op. (Content comes only from scripts/sync-data.mjs.)
        run: |
          node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of ["incidents.json", "summary.json", "incident.schema.json", "taxonomy.json", "SNAPSHOT.json"]) {
              const p = "data/snapshot/" + f;
              const raw = fs.readFileSync(p, "utf8");
              const norm = JSON.stringify(JSON.parse(raw), null, 2) + "\n";
              if (raw !== norm) { console.error("::error::" + p + " is not in sync-data canonical form"); bad++; }
            }
            process.exit(bad ? 1 : 0);
          '

  lighthouse:
    name: lighthouse (performance, accessibility, best practices, SEO)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve dist and audit the landing page and the map
        run: |
          # Same base path the build used (scripts/site-env.mjs derives it from GITHUB_REPOSITORY).
          BASE=$(node -e 'import("./scripts/site-env.mjs").then((m) => process.stdout.write(m.resolveBasePath()))')
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null "http://localhost:4173${BASE}" && break; sleep 0.5; done
          # A single performance sample on a shared runner swings by about ±8
          # points on identical output (observed 83–99 on the landing page while
          # the map held 98–99). Three runs per route, gated on the median per
          # category, is what Lighthouse CI does by default for the same reason.
          mkdir -p lighthouse
          for route in "/" "/map"; do
            name=$(echo "$route" | tr '/' '_')
            for n in 1 2 3; do
              npx --yes lighthouse@12 "http://localhost:4173${BASE}#${route}" \
                --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="./lighthouse/lh${name}-${n}.json" --quiet
            done
          done
          node -e '
            const fs = require("fs");
            const min = { performance: 0.9, accessibility: 0.95, "best-practices": 0.9, seo: 0.9 };
            const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
            const byRoute = new Map();
            for (const f of fs.readdirSync("lighthouse").filter((x) => /^lh.*-\d+\.json$/.test(x))) {
              const route = f.replace(/-\d+\.json$/, "");
              const cats = JSON.parse(fs.readFileSync(`lighthouse/${f}`, "utf8")).categories;
              const scores = byRoute.get(route) ?? {};
              for (const k of Object.keys(min)) (scores[k] ??= []).push(cats[k]?.score ?? 0);
              byRoute.set(route, scores);
            }
            let bad = 0;
            for (const [route, scores] of [...byRoute.entries()].sort()) {
              for (const [k, m] of Object.entries(min)) {
                const runs = scores[k].map((s) => (s * 100).toFixed(0));
                const med = median(scores[k]);
                const ok = med >= m;
                console.log(`${ok ? "OK  " : "FAIL"} ${route} ${k} median ${(med * 100).toFixed(0)} of [${runs.join(", ")}] (min ${m * 100})`);
                if (!ok) bad++;
              }
            }
            process.exit(bad ? 1 : 0);
          '
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse/*.json
          retention-days: 14
